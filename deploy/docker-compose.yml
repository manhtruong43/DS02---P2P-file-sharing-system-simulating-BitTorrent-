# DS02 BitTorrent - Docker Compose deployment
# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml up --build
# Secrets (TRACKER_API_KEY) are read from ../.env  (copy .env.example -> .env first).
#
# 4 containers, each one an independent node with its own hostname on the p2p_net network:
#   tracker (8000) | seeder (50051) | leecher1 (50052) | leecher2 (50053)
# Every peer limits its upload bandwidth to 512 KB/s so the download takes several seconds
# and parallel multi-source download / re-sharing between leechers is visible in the logs.
#
# Start-up order does not rely on fixed sleeps alone:
#   - the tracker has a healthcheck (GET /health); peers start only when it is healthy;
#   - the seeder also retries registration with backoff, and every peer re-registers the
#     file if the tracker answers 404 (e.g. tracker restarted and lost its in-memory state);
#   - leechers wait until the seeder has published the metadata file.

networks:
  p2p_net:
    driver: bridge

services:
  # 1. Central Tracker Server (metadata + peer list only, never serves file content)
  tracker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bittorrent_tracker
    command: python src/tracker.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - TRACKER_HOST=0.0.0.0
      - TRACKER_PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    networks:
      - p2p_net

  # 2. Seeder Node (initial owner of the file)
  #    Creates a 4 MB random file (16 chunks x 256 KB) and publishes only the metadata to /shared.
  seeder:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bittorrent_seeder
    command: >
      sh -c "
        rm -f /shared/test_data.bin.torrent.json &&
        python -c \"import os; open('/data/test_data.bin','wb').write(os.urandom(4*1024*1024))\" &&
        python src/metadata.py /data/test_data.bin http://tracker:8000 --out /shared/test_data.bin.torrent.json &&
        python src/peer_node.py --host seeder --port 50051 --tracker http://tracker:8000 --metadata /shared/test_data.bin.torrent.json --output /data/test_data.bin --seed --upload-limit 512
      "
    ports:
      - "50051:50051"
    env_file:
      - ../.env
    environment:
      - TRACKER_URL=http://tracker:8000
    depends_on:
      tracker:
        condition: service_healthy
    networks:
      - p2p_net
    volumes:
      - shared_meta:/shared
      - seeder_data:/data

  # 3. Leecher Node 1 (downloads from seeder, then re-shares chunks)
  #    Waits until the seeder has published the metadata, then a few seconds for the seeder to register.
  leecher1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bittorrent_leecher_1
    command: >
      sh -c "
        until [ -f /shared/test_data.bin.torrent.json ]; do sleep 1; done &&
        sleep 4 &&
        rm -f /data/download_1.bin &&
        python src/peer_node.py --host leecher1 --port 50052 --tracker http://tracker:8000 --metadata /shared/test_data.bin.torrent.json --output /data/download_1.bin --upload-limit 512
      "
    ports:
      - "50052:50052"
    env_file:
      - ../.env
    environment:
      - TRACKER_URL=http://tracker:8000
    depends_on:
      tracker:
        condition: service_healthy
      seeder:
        condition: service_started
    networks:
      - p2p_net
    volumes:
      - shared_meta:/shared:ro
      - leecher1_data:/data

  # 4. Leecher Node 2 (starts 1 s after leecher1, downloads from seeder AND leecher1)
  leecher2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bittorrent_leecher_2
    command: >
      sh -c "
        until [ -f /shared/test_data.bin.torrent.json ]; do sleep 1; done &&
        sleep 5 &&
        rm -f /data/download_2.bin &&
        python src/peer_node.py --host leecher2 --port 50053 --tracker http://tracker:8000 --metadata /shared/test_data.bin.torrent.json --output /data/download_2.bin --upload-limit 512
      "
    ports:
      - "50053:50053"
    env_file:
      - ../.env
    environment:
      - TRACKER_URL=http://tracker:8000
    depends_on:
      tracker:
        condition: service_healthy
      seeder:
        condition: service_started
    networks:
      - p2p_net
    volumes:
      - shared_meta:/shared:ro
      - leecher2_data:/data

volumes:
  # Only the .torrent.json metadata is shared (like downloading a .torrent file).
  # Each peer keeps its file data in its OWN volume, so file content
  # can only travel between containers over the network (gRPC).
  shared_meta:
  seeder_data:
  leecher1_data:
  leecher2_data:
